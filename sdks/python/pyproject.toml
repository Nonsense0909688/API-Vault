[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "api-vault-sdk"
version = "0.0.2"
description = "Python SDK for API-Vault"
readme = "README.md"
requires-python = ">=3.9"

authors = [
    { name = "Nonsense0909688" }
]

dependencies = [
    "requests>=2.31.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src/api_vault"]